<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숙성 · 로그인 및 회원가입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#151414;
  --panel:#1d1b1b;
  --line:#2f2b2a;
  --red:#7a0f1a;
  --gold:#c9a45c;
  --text:#ece6dc;
  --mute:#a79f94;
  --serif:'Noto Serif KR',serif;
  --sans:'Noto Sans KR',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--black);
  color:var(--text);
  font-family:var(--sans);
  line-height:1.7;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.logo{
  font-family:var(--serif);
  font-weight:900;
  font-size:32px;
  letter-spacing:.12em;
  text-align:center;
  margin-bottom:24px;
}
.logo small{
  display:block;
  font-family:var(--sans);
  font-weight:400;
  font-size:11px;
  letter-spacing:.25em;
  color:var(--gold);
  margin-top:-4px;
}

.auth-box{
  width:min(440px,100%);
  background:var(--panel);
  border:1px solid var(--line);
  padding:32px;
}
.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:20px;
}
.tabs button{
  padding:10px;
  border:1px solid var(--line);
  border-radius:2px;
  color:var(--mute);
  font-weight:500;
  transition:.2s;
}
.tabs button.on{
  background:var(--red);
  border-color:var(--red);
  color:#fff;
  font-weight:700;
}

label{
  display:block;
  font-size:13px;
  color:var(--mute);
  margin:14px 0 5px;
}
input{
  width:100%;
  padding:12px;
  background:var(--black);
  border:1px solid var(--line);
  color:var(--text);
  font:inherit;
}
input:focus{
  border-color:var(--gold);
  outline:none;
}
.chk{
  display:flex;
  gap:8px;
  align-items:flex-start;
  font-size:13px;
  color:var(--mute);
  margin-top:16px;
  cursor:pointer;
}
.chk input{
  width:auto;
  margin-top:5px;
}
.btn{
  display:block;
  width:100%;
  padding:13px;
  background:var(--red);
  color:#fff;
  font-weight:700;
  border-radius:2px;
  margin-top:20px;
  transition:background .2s;
}
.btn:hover{background:#98141f}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{
  background:none;
  border:1px solid var(--gold);
  color:var(--gold);
}
.btn.ghost:hover{
  background:var(--gold);
  color:var(--black);
}

.err{
  color:#ff7b7b;
  font-size:13px;
  min-height:20px;
  margin-top:10px;
}
.logged-in{
  text-align:center;
  padding:12px 0;
}
.logged-in h2{
  font-family:var(--serif);
  font-size:22px;
  color:var(--gold);
  margin-bottom:8px;
}
.logged-in p{
  font-size:14px;
  color:var(--mute);
  margin-bottom:6px;
}
.toast{
  position:fixed;
  left:50%;
  bottom:30px;
  transform:translateX(-50%) translateY(20px);
  background:var(--gold);
  color:#111;
  padding:12px 22px;
  font-weight:700;
  z-index:200;
  opacity:0;
  transition:.3s;
  pointer-events:none;
}
.toast.on{
  opacity:1;
  transform:translateX(-50%);
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
</head>
<body>

<div class="logo">숙성<small>AGED SPIRITS</small></div>

<main class="auth-box" id="authBox">
  <div class="tabs" id="authTabs">
    <button class="on" data-t="login">로그인</button>
    <button data-t="join">회원가입</button>
  </div>
  <div id="authBody"></div>
</main>

<div class="toast" id="toast"></div>

<script>
/* ===== Supabase 연결 값: 아래 두 줄을 내 프로젝트 값으로 바꾸세요 ===== */
const SUPABASE_URL = 'https://내프로젝트.supabase.co';
const SUPABASE_KEY = 'sb_publishable_내공개키';
const ready = /^https:\/\/[a-z0-9]+\.supabase\.co$/.test(SUPABASE_URL)
           && /^sb_publishable_[\w-]+$/.test(SUPABASE_KEY)
           && typeof supabase !== 'undefined';
const db = ready ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

let user = null;
let profile = null;
let authTab = 'login';

function toast(m) {
  const t = $('#toast');
  t.textContent = m;
  t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 2600);
}

/* ===== 체험 모드(localStorage) 로드 ===== */
const LU = () => store.get('users', {});
function localLoad() {
  const em = store.get('session', null);
  const u = LU()[em];
  if (u) {
    user = { id: em, email: em };
    profile = { name: u.name, phone: u.phone };
  } else {
    user = null;
    profile = null;
  }
}

/* ===== Supabase 프로필 로드 ===== */
async function loadProfile() {
  if (!db) { localLoad(); return; }
  if (!user) { profile = null; return; }
  let r = await db.from('shop_profiles').select('name, phone').eq('id', user.id).maybeSingle();
  if (!r.data) {
    await new Promise(s => setTimeout(s, 800));
    r = await db.from('shop_profiles').select('name, phone').eq('id', user.id).maybeSingle();
  }
  profile = r.data || { name: user.user_metadata?.name || '', phone: user.user_metadata?.phone || '' };
}

/* ===== 화면 렌더링 ===== */
function render() {
  const tabs = $('#authTabs');
  const body = $('#authBody');

  // 이미 로그인된 상태일 때
  if (user) {
    tabs.style.display = 'none';
    const displayName = (profile && profile.name) ? profile.name : user.email;
    body.innerHTML = `
      <div class="logged-in">
        <h2>${esc(displayName)}님, 환영합니다</h2>
        <p>이메일: ${esc(user.email)}</p>
        ${profile && profile.phone ? `<p>연락처: ${esc(profile.phone)}</p>` : ''}
        <button class="btn ghost" id="doLogout">로그아웃</button>
      </div>
    `;
    return;
  }

  // 비로그인 상태 (로그인 / 회원가입 폼)
  tabs.style.display = 'grid';
  $$('#authTabs button').forEach(b => b.classList.toggle('on', b.dataset.t === authTab));

  if (authTab === 'login') {
    body.innerHTML = `
      <form id="loginForm" novalidate>
        <label for="lem">이메일</label>
        <input id="lem" type="email" autocomplete="email" placeholder="example@email.com" required>
        <label for="lpw">비밀번호</label>
        <input id="lpw" type="password" autocomplete="current-password" required>
        <div class="err" id="aerr"></div>
        <button type="submit" class="btn" id="doLogin">로그인</button>
      </form>
    `;
  } else {
    body.innerHTML = `
      <form id="joinForm" novalidate>
        <label for="jem">이메일</label>
        <input id="jem" type="email" autocomplete="email" placeholder="example@email.com" required>
        <label for="jpw">비밀번호 (6자 이상)</label>
        <input id="jpw" type="password" autocomplete="new-password" required>
        <label for="jnm">이름</label>
        <input id="jnm" type="text" required>
        <label for="jph">연락처</label>
        <input id="jph" type="tel" placeholder="010-0000-0000" required>
        <label class="chk">
          <input type="checkbox" id="jag">
          <span>이용약관과 개인정보 수집에 동의합니다. (필수)</span>
        </label>
        <div class="err" id="aerr"></div>
        <button type="submit" class="btn" id="doJoin">이메일로 회원가입</button>
      </form>
    `;
  }
}

/* ===== 탭 전환 ===== */
$('#authTabs').onclick = e => {
  const b = e.target.closest('button');
  if (!b) return;
  authTab = b.dataset.t;
  render();
};

/* ===== 로그인 / 회원가입 / 로그아웃 처리 ===== */
$('#authBody').addEventListener('submit', async e => {
  e.preventDefault();
  const err = m => $('#aerr').textContent = m;

  // 1. 로그인 처리
  if (e.target.id === 'loginForm') {
    const email = $('#lem').value.trim();
    const password = $('#lpw').value;
    const btn = $('#doLogin');

    if (!email || !password) return err('이메일과 비밀번호를 입력하세요.');

    if (!db) {
      const u = LU()[email];
      if (!u || u.pw !== password) return err('이메일 또는 비밀번호가 맞지 않습니다.');
      store.set('session', email);
      localLoad();
      render();
      return toast('로그인되었습니다.');
    }

    btn.disabled = true;
    const { error } = await db.auth.signInWithPassword({ email, password });
    btn.disabled = false;

    if (error) {
      return err(
        /Invalid login/i.test(error.message) ? '이메일 또는 비밀번호가 맞지 않습니다.' :
        /not confirmed/i.test(error.message) ? '이메일 인증이 필요합니다. 받은 메일의 링크를 눌러 주세요.' :
        error.message
      );
    }
    toast('로그인되었습니다.');
  }

  // 2. 회원가입 처리
  if (e.target.id === 'joinForm') {
    const email = $('#jem').value.trim();
    const password = $('#jpw').value;
    const name = $('#jnm').value.trim();
    const phone = $('#jph').value.trim();
    const btn = $('#doJoin');

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return err('올바른 이메일을 입력하세요.');
    if (password.length < 6) return err('비밀번호는 6자 이상이어야 합니다.');
    if (!name || phone.replace(/\D/g, '').length < 10) return err('이름과 연락처를 모두 입력하세요.');
    if (!$('#jag').checked) return err('약관에 동의해 주세요.');

    if (!db) {
      const us = LU();
      if (us[email]) return err('이미 가입된 이메일입니다.');
      us[email] = { pw: password, name, phone };
      store.set('users', us);
      store.set('session', email);
      localLoad();
      render();
      return toast('회원가입이 완료되었습니다.');
    }

    btn.disabled = true;
    const { data, error } = await db.auth.signUp({
      email,
      password,
      options: { data: { name, phone } }
    });
    btn.disabled = false;

    if (error) {
      return err(/already/i.test(error.message) ? '이미 가입된 이메일입니다.' : error.message);
    }
    if (!data.session) {
      return err('인증 메일을 보냈습니다. 메일의 링크를 누른 뒤 로그인하세요.');
    }
    toast('회원가입이 완료되었습니다.');
  }
});

// 3. 로그아웃 처리
$('#authBody').addEventListener('click', async e => {
  if (e.target.id !== 'doLogout') return;
  if (db) {
    await db.auth.signOut();
  } else {
    store.set('session', null);
    localLoad();
    render();
  }
  toast('로그아웃되었습니다.');
});

/* ===== 인증 상태 감지 ===== */
if (db) {
  db.auth.onAuthStateChange((ev, s) => {
    user = s ? s.user : null;
    setTimeout(async () => {
      await loadProfile();
      render();
    }, 0);
  });
} else {
  localLoad();
}

render();
</script>
</body>
</html>
